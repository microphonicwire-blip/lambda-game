name: sign
on:
  push:
    branches: [main]
    paths: ['current.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: sign current.py
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: python tools/sign.py
      - name: commit check.txt
        run: |
          git config user.name "sign bot"
          git config user.email "sign-bot@users.noreply.github.com"
          git add check.txt
          git diff --cached --quiet || (git commit -m "sign" && git push)
