name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ';'
            file: logicsim.exe
          - os: ubuntu-latest
            sep: ':'
            file: logicsim-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame pyinstaller
      - name: build
        shell: bash
        run: pyinstaller --onefile --windowed --name logicsim --add-data "current.py${{ matrix.sep }}." launcher.py
      - name: rename linux binary
        if: runner.os == 'Linux'
        run: mv dist/logicsim dist/logicsim-linux
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.file }}
